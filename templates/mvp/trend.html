{% extends "mvp/base.html" %}

{% block title %}30天趋势 - BettaFish{% endblock %}

{% block content %}
<div class="glass panel fade-up">
  <div class="panel-title">趋势筛选</div>
  <div class="inline-filters">
    <select id="platformSelect">
      <option value="weibo">微博</option>
      <option value="xhs">小红书</option>
      <option value="dy">抖音</option>
    </select>
    <select id="themeSelect">
      <option value="">全部一级主题</option>
    </select>
    <select id="subThemeSelect">
      <option value="">全部次主题</option>
    </select>
    <select id="topicSelect">
      <option value="">可选话题（不选则手输）</option>
    </select>
    <input id="topicInput" type="text" placeholder="输入主题关键词（可选）">
    <input id="startDate" type="date">
    <input id="endDate" type="date">
    <button id="loadTrendBtn" class="btn-primary">更新趋势</button>
  </div>
</div>

<div class="panel-grid trend-grid">
  <div class="glass panel fade-up">
    <div class="panel-title">近30天 综合RI变化（含攻击占比）</div>
    <div id="riskChart" class="chart"></div>
  </div>
  <div class="glass panel fade-up">
    <div class="panel-title">话题数量变化</div>
    <div id="countChart" class="chart"></div>
  </div>
</div>

<div class="panel-grid trend-grid">
  <div class="glass panel fade-up">
    <div class="panel-title">风险矩阵气泡图（速度 × 恶意度）</div>
    <div id="riskMatrixChart" class="chart"></div>
  </div>
  <div class="glass panel fade-up">
    <div class="panel-title">风险等级分布</div>
    <div id="riskLevelChart" class="chart"></div>
  </div>
</div>

<div class="glass panel fade-up">
  <div class="panel-title">高风险主题 Top10</div>
  <div id="topRiskTopicChart" class="chart"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='mvp/js/trend.js', v='20260314b') }}"></script>
{% endblock %}
